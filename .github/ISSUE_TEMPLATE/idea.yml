name: I have an idea
description: Suggest something that would make fair.yoga more useful to you.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        fair.yoga aims to stay a calm, simple tool. Ideas in that spirit are very welcome.

        **This page is public.** Anyone on the internet can read what you write here, so please leave out names, email addresses, phone numbers and payment details — yours and anyone else's. Your GitHub username is shown too. If you'd rather not be named, email hello@fair.yoga instead.
  - type: dropdown
    id: role
    attributes:
      label: I use fair.yoga as a…
      options:
        - Teacher
        - Student
        - Developer / contributor
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help you?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What does it make easier? (optional)
      description: A moment from your week where this would have helped is the most useful thing you can tell us.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I haven't included anyone's name, email address, phone number or payment details.
          required: true
