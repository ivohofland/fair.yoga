name: E2E flake repro

# MANUAL ONLY. This never runs on push or pull_request: it exists to answer a
# question, not to gate anything, and it deliberately adds no status-check
# context that `ci.yml`'s required checks could be confused with.
#
# WHY IT IS A SEPARATE FILE. `ci.yml` puts every run in the concurrency group
# `ci-${{ github.ref }}` with `cancel-in-progress` for non-main refs. A job
# added there would either cancel the branch's real CI run or be cancelled by
# it, and this one wants to run for many minutes beside a normal push.
#
# WHAT IT IS FOR (roadmap "Class C, diagnosed"). `class-edit.spec.ts:129`
# fails its first attempt intermittently on CI: the click's RSC payload and
# route chunk both arrive in ~11ms and the client-side transition then never
# commits, so `waitForURL` sits until the test timeout. It does NOT reproduce
# locally — 10/10 green — against a warm dev server, which is the wrong
# condition. This job reproduces the right one: a cold production build.
#
# A RED RUN HERE MEANS THE FLAKE REPRODUCED, which is the result this job is
# for. Green means it did not reproduce at this repeat count, which bounds the
# rate rather than clearing it — `--retries=0` below is what makes each
# repeat an independent first-attempt sample, since a first-attempt failure is
# exactly what CI's `failOnFlakyTests` turns red.
#
# IT CANNOT BE DISPATCHED UNTIL THIS FILE IS ON THE DEFAULT BRANCH. GitHub
# resolves a `workflow_dispatch` workflow against `main` and only then lets
# you pick a `--ref`, so running it from the branch that introduces it answers
#
#     HTTP 404: workflow e2e-flake-repro.yml not found on the default branch
#
# Measured on 2026-08-28, from `docs/roadmap-after-272`. There is no flag that
# gets around it: merge first, dispatch second.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec file to run'
        default: 'tests/e2e/class-edit.spec.ts'
      grep:
        # DEFAULTS TO EMPTY ON PURPOSE, and the reason is a `gh` behaviour
        # worth stating rather than rediscovering: `-f grep=''` does NOT
        # override a non-empty default. GitHub treats an empty input as
        # absent and applies the default, so a filter that ships as the
        # default cannot be turned off from the CLI — measured 2026-08-28,
        # a run dispatched with `-f grep=''` and `-f spec=tests/e2e` ran
        # "5 tests" (one test x 5 repeats) instead of the whole directory.
        # Empty here means the caller opts INTO a filter and can always opt
        # out. The class C target is `a draft edits fully`.
        description: 'Test name filter (-g). Empty runs every test the spec path selects — closer to the ordering CI actually runs'
        default: ''
      project:
        description: 'Playwright project'
        default: 'Mobile Chrome'
        type: choice
        options: ['Mobile Chrome', 'chromium']
      repeat:
        description: 'Repeats per test (--repeat-each)'
        default: '20'

# `--repeat-each` IS UNSOUND ACROSS THE WHOLE SUITE, and the failures it
# invents look like findings. Measured 2026-08-28 at `repeat: 30` over
# `tests/e2e`: `auth.spec.ts > submitting email shows confirmation message`
# failed 10 times, and it was this job's own doing — the test posts the SAME
# address to `/api/auth/magic-link/send`, which rate-limits per email and
# answers 429. The failures land on consecutive passes (indices exactly 71
# apart, the per-pass test count), passes 11–20, then stop when the window
# expires. Nothing was wrong with the app or the test.
#
# So: a spec-scoped default rather than a suite-scoped one, and read any
# failure OUTSIDE the test under investigation as suspect until its repeat
# indices are checked. A real flake scatters; a self-inflicted one comes in a
# contiguous block.
concurrency:
  group: e2e-flake-repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ethical_yoga
          POSTGRES_USER: yoga
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Byte-identical to `ci.yml`'s `test-integration-e2e`. The whole point is
    # the same conditions; a difference here makes a green run meaningless.
    env:
      DATABASE_URL: postgresql://yoga:test_password@localhost:5432/ethical_yoga
      PASSKEY_RP_ID: localhost
      PASSKEY_RP_NAME: fair.yoga
      CRON_SECRET: ci-cron-secret
      CRON_SCHEDULER: 'off'
      RESEND_API_KEY: re_test
      EMAIL_DRY_RUN: '1'
      EMAIL_FROM: noreply@test.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies # postinstall runs prisma generate
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      # NO BUILD CACHE, unlike `ci.yml`. A cold build is part of the condition
      # under test — hydration timing on a first-served route is the suspected
      # variable, and a warm `.next-build/cache` is the local condition that
      # already fails to reproduce.
      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm run start > server.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::App did not become healthy within 30s"
          cat server.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Inputs arrive as env vars, never interpolated into the script — a
      # `${{ }}` inside `run:` is a shell injection from whoever dispatched.
      #
      # `--trace=on` overrides the config's `retain-on-failure`: this job wants
      # a trace for the PASSING repeats too, because the diagnosis needs the
      # difference between a navigation that commits and one that does not,
      # and the failing side is already in hand.
      - name: Repro run
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          PROJECT: ${{ inputs.project }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -o pipefail
          if [ -n "$GREP" ]; then
            npx playwright test "$SPEC" --project="$PROJECT" -g "$GREP" \
              --repeat-each="$REPEAT" --retries=0 --trace=on --reporter=list
          else
            npx playwright test "$SPEC" --project="$PROJECT" \
              --repeat-each="$REPEAT" --retries=0 --trace=on --reporter=list
          fi

      # `always()`, not `failure()`: a green repro run's traces are half the
      # comparison this job exists to produce.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-repro-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-repro-traces
          path: test-results/
          retention-days: 7

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-repro-server-log
          path: server.log
          retention-days: 7
