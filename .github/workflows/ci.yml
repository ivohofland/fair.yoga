name: CI

# No path filtering, deliberately. `checks` and `test` are required status
# checks on main, and a required check that never runs never reports — the
# pull request just sits pending with no way to merge it.
#
# `paths-ignore` for docs/** cannot express "only docs changed": it fires when
# *any* non-docs file changed, so a PR touching code and docs together matches
# it, and a stub workflow covering the inverse `paths` matches too. Both run,
# both report the same check names, and the stub — which always passes — can
# satisfy a context whose real run failed. That masks CI on exactly the checks
# the branch ruleset relies on.
#
# So everything runs on everything. This is a public repo, so the minutes are
# free; the cost is wall-clock on docs-only pull requests. If that becomes
# annoying, short-circuit the expensive *steps* inside the
# `test-integration` / `test-e2e` jobs rather than filtering the workflow trigger —
# the jobs must still run and report.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes the run for the previous one — don't spend
# minutes finishing a result nobody will read. PRs get the same treatment
# per branch; main itself never cancels (every main run is a release gate).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Fast static gates: no database, no build. Fails in ~2 minutes when the
  # problem is a type error or lint offence, instead of after a full build.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma validate resolves env("DATABASE_URL") even without connecting.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies # postinstall runs prisma generate
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      # Same command a contributor runs locally, so a green terminal and a
      # green CI mean the same thing. `npm test` does NOT type-check — Vitest
      # strips types via esbuild — so this is the only gate on every
      # compile-time pin in the repo, not just the ones in the services.
      # Deliberately not a list: `grep -rn ': NoneOf<' src/` is current, and a
      # list written here was accurate for one branch (see src/lib/type-pins.ts,
      # which makes the same argument about counting them).
      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Visible but non-blocking: the current high advisories live in
      # next/vite themselves with no compatible fix released yet.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # No database, no build: the components project is jsdom only
  # (vitest.config.ts). This job exists because it used to queue behind
  # container init and a build it never touched.
  test-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing connects here. The value exists so that a transitive
      # PrismaClient construction at import time resolves env("DATABASE_URL")
      # rather than throwing — same reason the `checks` job sets it.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies # postinstall runs prisma generate
        run: npm ci

      - name: Component tests
        run: npx vitest run --project components

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ethical_yoga
          POSTGRES_USER: yoga
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `unit` and `unit-sweeps` resolve their database as
      # `DATABASE_URL_TEST ?? DATABASE_URL` (vitest.config.ts) — with it unset,
      # the sweep files run against the shared database.
      DATABASE_URL: postgresql://yoga:test_password@localhost:5432/ethical_yoga
      DATABASE_URL_TEST: postgresql://yoga:test_password@localhost:5432/ethical_yoga_test
      PASSKEY_RP_ID: localhost
      PASSKEY_RP_NAME: fair.yoga
      CRON_SECRET: ci-cron-secret
      CRON_SCHEDULER: 'off'
      RESEND_API_KEY: re_test
      EMAIL_DRY_RUN: '1'
      EMAIL_FROM: noreply@test.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies # postinstall runs prisma generate
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      # Fails when schema.prisma and the migration history disagree —
      # catches migrations amended after being applied, and schema edits
      # committed without a migration. Lives here because it needs a live
      # database and this is the cheapest job that has one.
      - name: Check schema/migration drift
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      # THE SEED IS THE FIRST THING THAT CAN VIOLATE A NEW CONSTRAINT, and
      # `20260826080000_calendar_entry`'s own comment rests the placement of
      # `CalendarEntry_teacher_slot_excl` on that — while nothing in CI ever
      # ran it. #327 also widened what "violate" means: under the exact-start
      # key it replaced, a seed collision needed two of one teacher's classes
      # at the identical minute; under a RANGE constraint any two within a
      # duration of each other collide, and the seed writes eleven classes
      # across three teachers.
      #
      # THIS JOB, NOT THE INTEGRATION ONE. `DATABASE_URL` here is
      # `ethical_yoga`, which this job migrates and nothing then reads — both
      # vitest projects resolve to `DATABASE_URL_TEST` (`vitest.config.ts`), so
      # the seed cannot perturb a single assertion. The integration job's
      # database is the one the built app and the whole e2e suite run against,
      # and they run against an empty one today; seeding there would change
      # what every schedule, CRM and reporting assertion sees, which is a
      # behavioural change to the merge gate in exchange for a schema check.
      # It also lands beside the drift check, which is the other thing here
      # that needs a live database and tests no code.
      - name: Seed (the schema's first real writer)
        run: npx prisma db seed

      - name: Unit tests
        run: npx vitest run --project unit

      # A separate invocation, as defence in depth. What actually holds these
      # apart is `unit-sweeps`'s `fileParallelism: false`, and the conditions
      # that flag depends on: docs/test-database.md §2.
      - name: Whole-database sweep tests
        run: npx vitest run --project unit-sweeps

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ethical_yoga
          POSTGRES_USER: yoga
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yoga:test_password@localhost:5432/ethical_yoga
      PASSKEY_RP_ID: localhost
      PASSKEY_RP_NAME: fair.yoga
      CRON_SECRET: ci-cron-secret
      CRON_SCHEDULER: 'off'
      RESEND_API_KEY: re_test
      EMAIL_DRY_RUN: '1'
      EMAIL_FROM: noreply@test.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies # postinstall runs prisma generate
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      # Next.js incremental compile cache — cuts repeat builds roughly in half.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next-build/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Integration tests hit the HTTP API, so the built app must be
      # running. Start via the standalone server bundle (matching production Docker)
      # to ensure standalone-parity (#127). Fail HERE with the server log when
      # it never comes up — not three steps later with a wall of ECONNREFUSED.
      - name: Start app (standalone bundle)
        run: |
          cp -r .next-build/static .next-build/standalone/.next-build/static
          [ -d public ] && cp -r public .next-build/standalone/public || true
          node .next-build/standalone/server.js > server.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::App did not become healthy within 30s"
          cat server.log
          exit 1

      - name: Integration tests
        # `--file-parallelism` deliberately overrides this project's own
        # `fileParallelism: false` (#325) — a CLI flag wins over a project's
        # setting. `vitest.config.ts` and `docs/test-database.md` §2 both
        # describe this; update them if this line changes.
        run: npx vitest run --project integration --file-parallelism

      # THE APP'S LOG IS THE ONLY PLACE A 503's CAUSE IS NAMED. `api-utils.ts`
      # logs the thrown error beside `classifyApiError`'s verdict, and every
      # code that verdict maps to 503 — `TRANSIENT_SQLSTATES` and the Prisma
      # codes beside it — arrives at the client as the same status, so a
      # failing assertion can say `503` and nothing more. Until this step the
      # log was written and discarded unless the app failed to *start*, which
      # is why issue 331 needed a rerun to learn nothing new.
      - name: App log (on failure)
        if: failure()
        run: |
          if [ ! -f server.log ]; then echo "no server.log — app never started"; exit 0; fi
          echo "::group::contention and error lines"
          grep -aE 'contention|lock_not_available|deadlock|55P03|40P01|40001|P2024|P2028|P2034' server.log || echo "(none)"
          echo "::endgroup::"
          echo "::group::server.log (last 500 lines)"
          tail -n 500 server.log
          echo "::endgroup::"

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-integration
          path: server.log
          retention-days: 7

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ethical_yoga
          POSTGRES_USER: yoga
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yoga:test_password@localhost:5432/ethical_yoga
      PASSKEY_RP_ID: localhost
      PASSKEY_RP_NAME: fair.yoga
      CRON_SECRET: ci-cron-secret
      CRON_SCHEDULER: 'off'
      RESEND_API_KEY: re_test
      EMAIL_DRY_RUN: '1'
      EMAIL_FROM: noreply@test.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies # postinstall runs prisma generate
        run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      # Next.js incremental compile cache — cuts repeat builds roughly in half.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next-build/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # System deps still install every run (the runner is fresh); the
      # browser download is what the cache skips.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E tests run against the standalone app on :3000 (matching production Docker, #127).
      - name: Start app (standalone bundle)
        run: |
          cp -r .next-build/static .next-build/standalone/.next-build/static
          [ -d public ] && cp -r public .next-build/standalone/public || true
          node .next-build/standalone/server.js > server.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::App did not become healthy within 30s"
          cat server.log
          exit 1

      # The app from the start step is listening; playwright.config
      # reuses an existing server on :3000.
      - name: End-to-end tests
        run: npx playwright test

      - name: App log (on failure)
        if: failure()
        run: |
          if [ ! -f server.log ]; then echo "no server.log — app never started"; exit 0; fi
          echo "::group::contention and error lines"
          grep -aE 'contention|lock_not_available|deadlock|55P03|40P01|40001|P2024|P2028|P2034' server.log || echo "(none)"
          echo "::endgroup::"
          echo "::group::server.log (last 500 lines)"
          tail -n 500 server.log
          echo "::endgroup::"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-e2e
          path: server.log
          retention-days: 7

  # This job exists so the branch ruleset's required status check named
  # `test` keeps reporting after the split: ruleset 19724469 requires the
  # contexts `checks` and `test` (re-derive:
  # `gh api repos/:owner/:repo/rulesets/19724469`), and a check that never runs
  # leaves the pull request pending with no way to merge (same argument as
  # this file's header).
  #
  # Both halves below are load-bearing, and neither works alone.
  #
  # `if: always()`, because a failed dependency SKIPS a job rather than
  # failing it, and GitHub counts a skipped required check as satisfied:
  # "Required status checks must have a successful, skipped, or neutral
  # status before collaborators can make changes to a protected branch."
  # Without `always()` this context therefore goes green exactly when a
  # test job goes red — demonstrated on PR #324, where a red `test-components`
  # left this context SKIPPED and the pull request MERGEABLE.
  # (docs.github.com/en/pull-requests/reference/status-checks, read 2026-08-24.)
  #
  # The explicit verdict, because `always()` on its own runs the job and
  # passes it whatever the dependencies did. The step re-derives the answer
  # from `needs.*.result` instead, as an allowlist — anything that is not
  # `success` fails, so a result state GitHub adds later fails closed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-components, test-unit, test-integration, test-e2e]
    if: always()
    steps:
      - name: Verify every test job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "dependency results: $RESULTS"
          # An empty expansion would sail through the loop below untouched.
          if [ -z "$RESULTS" ]; then
            echo "::error::No dependency results to check - refusing to report success."
            exit 1
          fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A test job concluded '$result' - failing the aggregate gate."
              exit 1
            fi
          done
