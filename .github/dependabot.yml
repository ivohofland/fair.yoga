# Keeps every ecosystem below from silently aging. Monthly; a multi-package
# ecosystem groups minor/patch into one tidy PR rather than a weekly drizzle.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    # Majors arrive as individual PRs so breaking changes get read alone.
    # pnpm refuses a lockfile entry younger than `minimumReleaseAge`
    # (`pnpm-workspace.yaml`; docs/supply-chain.md carries its value and the
    # measurement) and CI installs with --frozen-lockfile, so a PR proposing a
    # fresher version fails the merge gate.
    #
    # THIS COOLDOWN IS DELIBERATELY ONE DAY LONGER THAN THAT SETTING, and the
    # margin is the point: pnpm counts minutes from publish, Dependabot counts
    # days at PR-creation time, and two clocks computing the same window
    # eventually disagree at the boundary. The cost of the margin is one extra
    # day of staleness; the cost of the boundary is a red PR. Change this only
    # together with `minimumReleaseAge`, and keep it ahead.
    cooldown:
      default-days: 8

  # Tracks the Dockerfile's base-image tag (#562). With a digest present,
  # Dependabot proposes tag and digest together, so this entry is what keeps
  # the pin from going stale rather than what introduces it.
  # docs/supply-chain.md ("The base image and the package manager binary")
  # has the reasoning, the current state of every image this repo pins,
  # and which Dependabot entry (or script) tracks each.
  #
  # `default-days: 8` here isn't tied to a setting the way the npm entry's
  # is to `minimumReleaseAge` — Docker Hub has no equivalent release-age
  # gate this repo enforces — it's the same general
  # let-a-new-artifact-age-briefly posture, applied for consistency.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 8

  # docker-compose is a separate ecosystem from docker above — it does not
  # scan Dockerfiles, and docker above does not scan compose files. Covers
  # docker-compose.yml and docker-compose.prod.yml, both of which pin
  # postgres by digest. docs/supply-chain.md has what this entry does not
  # reach (the postgres images CI's workflow `services:` blocks pull).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 8
