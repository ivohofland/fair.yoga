services:
  db:
    # Digest-pinned — see docs/supply-chain.md ("The base image and the
    # package manager binary") for why, and dependabot.yml's docker-compose
    # entry for what keeps it current.
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    # Come back after a Docker daemon restart or reboot, but respect a
    # deliberate `docker compose stop` — otherwise the dev server's scheduler
    # sweeps fail every minute until someone notices the container is gone.
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ethical_yoga
      POSTGRES_USER: yoga
      POSTGRES_PASSWORD: yoga_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yoga -d ethical_yoga']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
